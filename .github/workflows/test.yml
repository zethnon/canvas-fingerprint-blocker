name: Canvas regression tests
on:
  push:
    branches: [fix/core-rewrite]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm test
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          CANVAS_AUDIT: ${{ (contains(github.event.head_commit.message, '[audit]') || contains(github.event.head_commit.message, '[bench]')) && '1' || '0' }}
          CANVAS_EXTERNAL: ${{ contains(github.event.head_commit.message, '[audit]') && '1' || '0' }}
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: always()
        with:
          name: canvas-audit
          path: test-results/
          if-no-files-found: ignore
