name: Canvas regression tests
on:
  push:
    branches: [fix/core-rewrite]
  pull_request:
permissions:
  contents: read
jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
  chromium:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm install --ignore-scripts --no-audit --no-fund
      - run: npx playwright install --with-deps chromium
      - run: npm run test:browser
        env:
          CANVAS_AUDIT: ${{ contains(github.event.head_commit.message, '[audit]') && '1' || '0' }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: canvas-audit
          path: test-results/
          if-no-files-found: ignore
